name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pandas openpyxl

      - name: Build EXE with PyInstaller
        run: >
          pyinstaller --onefile --windowed --name "SamsungCreativeGenerator"
          --add-data "assets;assets"
          samsung_generator.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamsungCreativeGenerator-windows-exe
          path: dist/SamsungCreativeGenerator.exe
